[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-cdn"
version = "0.14.0"
description = "Media/CDN management Django app for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "cdn", "media", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floor 0.26.0: `generate_error_keys` only started emitting the `owner`
    # field docs/errors.json (and its drift gate, tests/test_contract.py)
    # requires on 0.26.0+ — on 0.24.0 every entry is missing the key outright
    # rather than carrying `owner: null`.
    "stapel-core>=0.26.0,<1.0",
    "celery>=5",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-cdn"
Repository = "https://github.com/usestapel/stapel-cdn"
Documentation = "https://github.com/usestapel/stapel-cdn#readme"
Changelog = "https://github.com/usestapel/stapel-cdn/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-cdn/issues"

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
# libvips binding for the image path. Needs the system libvips library present
# at runtime (apt: libvips-dev). Core, and since 0.10 the ONLY image decoder
# this library has: upload validation, admin validation, URL-import format
# detection and every Image.save() dimension read all go through it. Pillow
# used to be a hard dependency doing the validating while pyvips did the
# processing — two decoders with different format support, which is how a HEIC
# that libvips reads natively came to be refused at the door. Turning the
# gatekeeper into the worker removes the divergence rather than patching one
# instance of it (adding `pillow_heif` would have kept both decoders and let
# them drift again on the next format).
#
# Not a hard dependency because pip cannot install a system library: the scaffold's
# vips-builder stage (stapel_tools._templates) and stapel-studio's devcontainer
# both install libvips unconditionally, so any project doing image work has it by
# construction. Installing outside those without libvips fails when pyvips
# compiles — loudly, at install time, naming the missing system package. That is
# the good failure; the one removed here was a successful install that refused
# valid uploads in production months later. checks.E001 covers the rest.
images = ["pyvips>=2.2"]
# ffmpeg is a SYSTEM binary, not a pip package — there is nothing to
# `pip install` for video/recordings today. These extras exist as markers:
# "this deployment enables the video/recordings submodule" for deploy
# tooling to read (cdn-modularity.md §3 — the ffmpeg apt layer belongs only
# in a VPS/prod image, never the studio devcontainer) and for hosts to
# express intent (pair with STAPEL_CDN["ENABLED_SUBMODULES"], which is what
# actually turns on the checks.py ffmpeg probes). No pyvips-style pip
# dependency to add here yet — see stapel_cdn.services.VideoProcessingService
# / AudioProcessingService docstrings for the (unimplemented) pipeline.
video = []
recordings = []
# files: passthrough storage, no processing — no extra needed. Listed for
# symmetry with the submodule table in MODULE.md/CONFIG.MD, not because it
# adds any dependency.
files = []
all = ["stapel-cdn[s3,images,video,recordings]"]
# Pillow is NOT a runtime dependency (see `images` above). It stays as a
# TEST-ONLY encoder: the suite generates its fixture images with a codec
# independent of the one under test, so "vips writes exactly what vips reads"
# cannot hide a real decode bug.
test = ["Pillow>=9.0"]

[tool.setuptools]
package-dir = {"stapel_cdn" = "."}
packages = ["stapel_cdn", "stapel_cdn.management", "stapel_cdn.management.commands", "stapel_cdn.migrations"]

[tool.setuptools.package-data]
stapel_cdn = ["py.typed", "migrations/*.py", "schemas/**/*.json", "migrations/**/*.py", "docs/capabilities.json", "docs/llms.txt", "docs/schema.json", "docs/flows.json", "docs/errors.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.coverage.run]
omit = ["*/tests/*", "*/conftest.py", "*/migrations/*"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"
